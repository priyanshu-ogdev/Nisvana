# docker-compose.hub.yml — AEGIS Hub Container
#
# Start: docker compose -f docker-compose.hub.yml up -d
# Logs:  docker compose -f docker-compose.hub.yml logs -f
#
# TLS (optional): generate certs first:
#   bash scripts/generate_cert.sh
# Then set AEGIS_HUB_SSL_CERT / AEGIS_HUB_SSL_KEY in .env.hub

services:
  aegis-hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    image: aegis-hub:latest
    container_name: aegis-hub

    ports:
      - "${AEGIS_HUB_PORT:-8001}:8001"

    environment:
      - AEGIS_HUB_HOST=0.0.0.0
      - AEGIS_HUB_PORT=8001
      # Auth token MUST be set — hub fails fast if absent and AEGIS_DEV_MODE!=1
      - AEGIS_AUTH_TOKEN=${AEGIS_AUTH_TOKEN}
      - AEGIS_DEV_MODE=${AEGIS_DEV_MODE:-0}
      # TLS (comment out if not using TLS)
      - AEGIS_HUB_SSL_CERT=${AEGIS_HUB_SSL_CERT:-}
      - AEGIS_HUB_SSL_KEY=${AEGIS_HUB_SSL_KEY:-}

    volumes:
      # TLS certificates (read-only in container)
      - ./certs:/app/certs:ro
      # Hub logs
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: >
        python -c "
        import socket, sys;
        s=socket.socket();
        s.settimeout(3);
        s.connect(('127.0.0.1', 8001));
        s.close();
        sys.exit(0)"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

    # Minimal resource limits — hub is CPU-light (routes, never decodes)
    deploy:
      resources:
        limits:
          memory: 256M
